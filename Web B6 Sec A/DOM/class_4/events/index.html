<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script async src="script.js"></script>
  </head>
  <body>
    <button id="clickBtn">click me</button>
    <p id="message">Waiting for Click...</p>

    <button id="darkMD">Dark Mode</button>
    <button id="lightMD">Light Mode</button>

    <div class="">
      <input type="text" id="search" placeholder="Enter keyword" />
      <button id="showinputResult">Show Result</button>
      <p id="output"></p>
    </div>
    <select id="course">
      <option value="">Select a course</option>
      <option value="html">HTML</option>
      <option value="css">CSS</option>
      <option value="javascript">JavaScript</option>
    </select>

    <p id="selectedCourse">No course selected</p>

    <form id="registrationForm">
      <input type="text" id="name" placeholder="Enter your name" required />
      <label for="">Gender</label>
      <input type="radio" name="gender" value="Male" />Male
      <input type="radio" name="gender" value="Female" /> Female
      <button type="submit">Register</button>
    </form>

    <p id="result"></p>
  </body>
</html>
