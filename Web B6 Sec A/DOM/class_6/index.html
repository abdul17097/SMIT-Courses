<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script async src="script.js"></script>
  </head>
  <body>
    <form action="" id="studentForm">
      <label for="">Username:</label>
      <input type="text" id="username" />
      <label for="">Gender</label>
      <input type="radio" name="gender" value="male" id="male" />male
      <input type="radio" name="gender" value="female" id="" />female

      <br />
      <input type="checkbox" name="languages" value="English" id="" />English
      <input type="checkbox" name="languages" value="Urdu" id="" />Urdu
      <input type="checkbox" name="languages" value="Arabic" id="" />Arabic
      <input type="checkbox" name="languages" value="Pashto" id="" />Pashto
      <button id="btn">Show Result</button>

      <select name="country" id="country">
        <option value="pakistan">Pakistan</option>
        <option value="iran">Iran</option>
        <option value="turkey">Turkey</option>
        <option value="china">China</option>
      </select>
    </form>
    <p id="result"></p>
  </body>
</html>
