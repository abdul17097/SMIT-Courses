<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        border: 1px solid;
        display: grid;
        height: 60vh;
        grid-template-columns: repeat(4, 1fr);
      }
      .grid-item {
        border: 1px solid;
        /* width: 55px;
        height: 55px; */
      }
      .grid-item-2 {
        /* grid-column-start: 2;
        grid-column-end: 4; */
        grid-column: 2/4;
      }
      .grid-item-1 {
        /* grid-row-start: 1;
        grid-row-end: 4; */
        grid-row: 1/4;
      }
      .grid-item-6 {
        /* grid-row-start: 2;
        grid-row-end: 4; */
        grid-row: 2/4;
        /* grid-column-start: 4;
        grid-column-end: 4; */
        grid-column: 4/4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="grid-item grid-item-1">1</div>
      <div class="grid-item grid-item-2">2</div>
      <div class="grid-item grid-item-3">3</div>
      <div class="grid-item grid-item-4">4</div>
      <div class="grid-item grid-item-5">5</div>
      <div class="grid-item grid-item-6">6</div>
      <div class="grid-item grid-item-7">7</div>
      <div class="grid-item grid-item-8">8</div>
    </div>
  </body>
</html>
