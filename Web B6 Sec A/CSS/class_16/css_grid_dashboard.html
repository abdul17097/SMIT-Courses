<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .container {
        width: 100%;
        height: 100vh;
        border: 1px solid;
      }
      header {
        border: 1px solid;
        display: flex;
        justify-content: space-around;
        align-items: center;
        height: 10vh;
      }
      header > ul {
        display: flex;
        gap: 10px;
        list-style: none;
      }
      header > div {
        font-size: 24px;
        font-weight: bold;
      }
      main {
        height: 90vh;
        border: 1px solid;
        box-sizing: border-box;
        display: flex;
      }
      aside {
        border: 1px solid;
        box-sizing: border-box;
        height: 100%;
        width: 20%;
        padding: 30px;
      }
      aside > ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .grid-container {
        width: 80%;
        border: 1px solid;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        padding: 30px;
        gap: 10px;
      }
      .grid-item {
        border: 1px solid;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        /* height: 200px; */
      }
      .grid-item-4 {
        grid-column: 1/3;
        grid-row: 2/4;
      }
      .grid-item-5 {
        grid-row: 2/4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="">Logo</div>
        <ul>
          <li><a href="">Link 1</a></li>
          <li><a href="">Link 2</a></li>
          <li><a href="">Link 3</a></li>
          <li><a href="">Link 4</a></li>
        </ul>
      </header>
      <main>
        <aside>
          <ul>
            <li><a href="">Link 1</a></li>
            <li><a href="">Link 2</a></li>
            <li><a href="">Link 3</a></li>
            <li><a href="">Link 4</a></li>
          </ul>
        </aside>
        <div class="dashboard-body grid-container">
          <div class="grid-item grid-item-1"><span>1</span></div>
          <div class="grid-item grid-item-2">2</div>
          <div class="grid-item grid-item-3">3</div>
          <div class="grid-item grid-item-4">4</div>
          <div class="grid-item grid-item-5">5</div>
        </div>
      </main>
    </div>
  </body>
</html>
