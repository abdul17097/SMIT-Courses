<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* syntex:
      @media media_type & media_feature  {
          .class_name{

          }
      }         */

      /* Break points:
      Mobile: mix-425px
      tablet: mix-768px
      desktop: mix-1024px */
      /* media-type: optional */
      .container {
        width: 100%;
        height: 50vh;
        background-color: aqua;
      }

      @media (max-width: 425px) {
        .container {
          background-color: red;
        }
      }

      @media (min-width: 426px) {
        .container {
          background-color: rgb(144, 131, 131);
        }
      }
      @media (min-width: 769px) {
        .container {
          background-color: rgb(93, 22, 185);
        }
      }
      @media (min-width: 1025px) {
        .container {
          background-color: rgb(27, 185, 22);
        }
      }
      @media (min-width: 1401px) {
        .container {
          background-color: rgb(79, 93, 39);
        }
      }
    </style>
  </head>
  <body>
    <div class="container"></div>
  </body>
</html>
